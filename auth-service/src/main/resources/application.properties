spring.application.name=auth-service
server.port=8086

# Eureka client configuration
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Database configuration (PostgreSQL for development)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/lms_db}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT secret key
jwt.secret=${JWT_SECRET:supersecretkey-supersecretkey-2026}
jwt.expiration=${JWT_EXPIRATION_MS:3600000}
#jwt.expiration=${JWT_EXPIRATION_MS:60000} # 1 minute for testing
jwt.refreshExpiration=${JWT_REFRESH_EXPIRATION_MS:604800000}

# Password hashing
app.password.pepper=${PASSWORD_PEPPER:super-secret-pepper-2026}
